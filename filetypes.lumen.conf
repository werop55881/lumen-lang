#[Lumen]
file_type=Lumen
comment_line=#
comment_block_start=/*
comment_block_end=*/
set_indent_chars=   4
set_indent_auto=TRUE
fold_at_each_colon=FALSE
fold_comments=FALSE
fold_c_comments=FALSE
fold_multiline_comments=FALSE

lexer_file_type=text
single_line_comment_style=1
multi_line_comment_style=2
keyword_class_1=and break catch class def else false finally for from if import in is let nil None or print return super this throw try True False while
keyword_class_2=
keyword_class_3=
keyword_class_4=
keyword_class_5=
keyword_class_6=
keyword_class_7=
keyword_class_8=
keyword_class_9=
string_1='
string_2="
string_3=

# Indentation
indentation_width=4
indent_size=4
use_tabs=FALSE

# Highlighting
foreground=#000000
background=#FFFFFF
selection_foreground=#FFFFFF
selection_background=#0000FF
current_line_foreground=#000000
current_line_background=#E0E0E0
word_wrap=FALSE

[settings]
lexer_file_type=text

[build_settings]
run_cmd=pwsh -NoProfile -ExecutionPolicy Bypass -File "%f"

[run]
cmd=pwsh -NoProfile -ExecutionPolicy Bypass -File "%f"
label=Run Lumen

[build-menu]
FT_00=Lumen
EX_00=_Build
CMD_00=pwsh -NoProfile -ExecutionPolicy Bypass -File "%f"
